name: Sweep Sleeper and publish the GM app

on:
  push:
    branches: [main]
  schedule:
    # Pacific time is UTC-7 in season. 13:30 UTC = 6:30 AM PT. The committed sweep is only the offline
    # fallback baked into the page; the Vercel app pulls Sleeper live and its advisor runs on its own.
    # 15 minutes before each run of the "Robinsavages advisor" cloud routine (7 AM, 1 PM, 9 PM PT while PDT holds):
    # the routine's sandbox cannot reach Sleeper or Vercel, so it reads data/context.json from this commit
    - cron: "45 3,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep Sleeper and bake the app
        run: python3 scripts/build.py
      - name: Fetch the advisor's prompt from the Vercel app (for the cloud routine)
        run: |
          for i in 1 2 3 4; do
            if curl -sf --max-time 150 "https://robinsavages.vercel.app/api/context?fresh=1" -o data/context.new && python3 -c "import json; d=json.load(open('data/context.new')); assert d['ok'], d"; then
              mv data/context.new data/context.json; echo "context fetched"; break
            fi
            echo "context fetch failed (try $i)"; rm -f data/context.new; sleep 20
          done
      - name: Show the sweep
        run: cat data/sweep.md
      - name: Commit the sweep (the offline fallback baked into the page)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sweep.json data/sweep.md
          [ -f data/context.json ] && git add data/context.json
          if git diff --cached --quiet; then echo "sweep unchanged"; else
            git commit -m "Sweep: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main   # build.py rewrites app/gm.html in place
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
