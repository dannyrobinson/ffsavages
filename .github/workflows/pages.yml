name: Sweep Sleeper and publish the GM app

on:
  push:
    branches: [main]
  schedule:
    # Pacific time is UTC-7 in season. 13:30 UTC = 6:30 AM PT. The committed sweep is only the offline
    # fallback baked into the page; the Vercel app pulls Sleeper live and its advisor runs on its own.
    - cron: "30 13 * * 2"   # Tue 6:30 AM PT   — waiver day
    - cron: "30 13 * * 3"   # Wed 6:30 AM PT   — claims have cleared
    - cron: "30 13 * * 4"   # Thu 6:30 AM PT   — TNF lock day
    - cron: "30 13 * * 6"   # Sat 6:30 AM PT   — final designations are in
    - cron: "30 13 * * 0"   # Sun 6:30 AM PT   — inactives morning
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep Sleeper and bake the app
        run: python3 scripts/build.py
      - name: Show the sweep
        run: cat data/sweep.md
      - name: Commit the sweep (the offline fallback baked into the page)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sweep.json data/sweep.md
          if git diff --cached --quiet; then echo "sweep unchanged"; else
            git commit -m "Sweep: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main   # build.py rewrites app/gm.html in place
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
